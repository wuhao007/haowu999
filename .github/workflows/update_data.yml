name: Daily Data Update
on:
  schedule:
    - cron: '0 1 * * *'  # Everyday at 01:00 UTC (09:00 Beijing time)
  workflow_dispatch:     # Allows manual trigger from the Actions tab
permissions:
  contents: write        # Necessary for the action to push changes back to the repo
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # Caches pip dependencies for faster builds
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run data update pipeline
        run: python haowu999_summary.py
      - name: Commit and push changes
        run: |
          git config user.name "haowu-bot"
          git config user.email "bot@haowu999.com"
          git add latest_data.json config_client.json index.html
          git diff --staged --quiet || (git commit -m "Auto: data refresh $(date +%Y-%m-%d)" && git push)
